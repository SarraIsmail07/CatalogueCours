<div class="controles">
  <input [(ngModel)]="recherche" placeholder="Rechercher un cours...">
  <select [(ngModel)]="tri">
    <option value="asc">Titre A → Z</option>
    <option value="desc">Titre Z → A</option>
  </select>
</div>

<section class="liste-cours">
  @for (c of cours | filtreCours:recherche | triCours:tri; track c.titre) {
    <article class="carte-cours" [class.actif]="c === coursActif">
      <h2>{{ c.titre }}</h2>
      <p>Catégorie : {{ c.categorie }}</p>
      <p>Durée : {{ c.duree }}</p>
      <p>Places disponibles : {{ c.places }}</p>
      <a [routerLink]="['/cours', c.id]">Voir le détail</a>
    </article>
  } @empty {
    <p>Aucun cours ne correspond à la recherche.</p>
  }
</section>
